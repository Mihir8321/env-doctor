name: Docs verification

on:
  pull_request:
    paths:
      - 'docs/**'

jobs:
  verify-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check docs include config checksum
        run: |
          for f in $(git diff --name-only origin/main HEAD -- 'docs/'); do
            if ! grep -qE "checksum" "$f"; then
              echo "❌ $f missing config checksum"
              exit 1
            fi
          done